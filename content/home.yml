about:
  title: "Built on Experience. Focused on Quality."
  paragraph_1: "Patino Builders was created as the construction division of Patino Landscape Group to showcase and deliver premium outdoor construction services with the professionalism, field experience, and craftsmanship clients expect from an established team."
  paragraph_2: "From bluestone patios and custom walkways to outdoor kitchens, stone fireplaces, retaining walls, and complete courtyard transformations, our goal is to build outdoor spaces that look exceptional and perform for years to come."
  button_text: "Start Your Project"
  button_link: "#contact"
  checklist:
    - "Custom Patio Construction"
    - "Outdoor Kitchens & Entertainment Areas"
    - "Stone Fireplaces & Fire Features"
    - "Retaining Walls & Masonry"
    - "Landscape Construction & Site Enhancements"
    - "Powered by Patino Landscape Group"

